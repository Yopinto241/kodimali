# Limit JVM-internal pools (including R8) as well as Gradle workers on low-memory hosts.
org.gradle.jvmargs=-Xmx1G -XX:+UseSerialGC -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:ActiveProcessorCount=2 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
